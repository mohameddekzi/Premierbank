<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premier Bank — Banking Made Easy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================================
   Premier Bank — global stylesheet
   ========================================================================== */

:root {
  --pb-primary: #0b2f4f;
  --pb-primary-700: #082138;
  --pb-primary-300: #36567a;
  --pb-secondary: #6cbe46;
  --pb-secondary-700: #4d9a2c;
  --pb-secondary-100: #e7f5dc;
  --pb-cream: #f7f4ee;
  --pb-paper: #ffffff;
  --pb-ink: #0d1b2a;
  --pb-muted: #5b6b7c;
  --pb-line: #e7e9ee;
  --pb-warm: #fff7ec;
  --pb-warm-2: #fce8d4;
  --pb-density: 1;
  --pb-radius: 18px;
  --pb-radius-lg: 28px;
  --pb-shadow: 0 12px 40px -16px rgba(11, 47, 79, .18);
  --pb-shadow-lg: 0 30px 80px -28px rgba(11, 47, 79, .32);
  --pb-bg-body: #f8f6f1;
}

[data-pb-density="compact"] { --pb-density: 0.82; }

[data-pb-theme="dark"] {
  --pb-bg-body: #08172a;
  --pb-paper: #0e2440;
  --pb-cream: #0a1f38;
  --pb-warm: #102b4a;
  --pb-warm-2: #143459;
  --pb-ink: #f1f5f9;
  --pb-muted: #9bb1c8;
  --pb-line: rgba(255, 255, 255, .08);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: "Lexend", system-ui, sans-serif;
  background: var(--pb-bg-body);
  color: var(--pb-ink);
  -webkit-font-smoothing: antialiased;
}

button, input { font-family: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.pb-container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

.pb-section { padding: calc(80px * var(--pb-density)) 0; }
.pb-section-head { max-width: 760px; margin: 0 auto calc(44px * var(--pb-density)); text-align: center; }
.pb-section-head h2 { font-size: clamp(32px, 4vw, 56px); line-height: 1.05; letter-spacing: -1px; margin: 12px 0 16px; font-weight: 600; text-wrap: balance; }
.pb-section-head h2 em { font-style: italic; color: var(--pb-secondary-700); font-weight: 500; }
.pb-section-head p { color: var(--pb-muted); font-size: 18px; line-height: 1.55; max-width: 600px; margin: 0 auto; }

.pb-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--pb-secondary-700);
  background: var(--pb-secondary-100);
  padding: 6px 14px; border-radius: 999px;
}
.pb-eyebrow-light { background: rgba(255, 255, 255, .14); color: #d6efc4; }

.pb-h1 { font-size: clamp(40px, 5.6vw, 84px); line-height: 1; letter-spacing: -2px; font-weight: 600; margin: 16px 0 20px; text-wrap: balance; color: var(--pb-primary); }
.pb-h2-light { color: #fff; font-size: clamp(32px, 4vw, 56px); line-height: 1.05; letter-spacing: -1px; font-weight: 600; margin: 12px 0 16px; }

.pb-link-arrow {
  background: transparent; border: 0; padding: 0;
  color: var(--pb-secondary-700); font-weight: 600;
  display: inline-flex; gap: 6px; align-items: center; cursor: pointer;
  font-family: inherit; font-size: 14px;
}
.pb-link-arrow:hover { color: var(--pb-primary); }

/* ========================================================================== */
/*  Buttons                                                                   */
/* ========================================================================== */
.pb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; cursor: pointer;
  padding: 12px 22px; border-radius: 999px;
  font-size: 14px; font-weight: 600; letter-spacing: -0.1px;
  transition: all .2s ease;
  font-family: inherit;
}
.pb-btn-lg { padding: 16px 28px; font-size: 15px; }
.pb-btn-block { width: 100%; }
.pb-btn-primary { background: var(--pb-primary); color: #fff; }
.pb-btn-primary:hover { background: var(--pb-primary-700); transform: translateY(-1px); }
.pb-btn-secondary { background: var(--pb-secondary); color: var(--pb-primary); }
.pb-btn-secondary:hover { background: var(--pb-secondary-700); color: #fff; }
.pb-btn-outline { border-color: var(--pb-primary); color: var(--pb-primary); background: transparent; }
.pb-btn-outline:hover { background: var(--pb-primary); color: #fff; }
.pb-btn-ghost { background: rgba(11, 47, 79, .06); color: var(--pb-primary); }
.pb-btn-ghost:hover { background: rgba(11, 47, 79, .12); }
.pb-btn-glass { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(20px); border-color: rgba(255, 255, 255, .24); }
.pb-btn-glass:hover { background: rgba(255, 255, 255, .26); }

/* ========================================================================== */
/*  Utility bar                                                               */
/* ========================================================================== */
.pb-utility { background: var(--pb-primary-700); color: #cdd8e4; font-size: 12px; }
.pb-utility-inner { display: flex; justify-content: space-between; padding: 8px 32px; }
.pb-utility-left, .pb-utility-right { display: flex; gap: 14px; align-items: center; }
.pb-utility-left span { display: inline-flex; align-items: center; gap: 6px; }
.pb-utility-right a:hover { color: #fff; }
.pb-util-sep { opacity: .5; }
.pb-lang-btn { background: transparent; border: 0; color: #cdd8e4; cursor: pointer; padding: 0; font-size: 12px; font-weight: 500; font-family: inherit; }
.pb-lang-btn.is-active { color: #fff; font-weight: 700; }
.pb-lang-sep { opacity: .5; }

/* ========================================================================== */
/*  Nav                                                                       */
/* ========================================================================== */
.pb-nav { position: sticky; top: 0; z-index: 60; }
.pb-nav-main { background: rgba(255, 255, 255, .9); backdrop-filter: blur(18px) saturate(160%); border-bottom: 1px solid var(--pb-line); transition: all .25s ease; }
[data-pb-theme="dark"] .pb-nav-main { background: rgba(8, 23, 42, .9); }
.pb-nav.is-scrolled .pb-nav-main { background: rgba(255, 255, 255, .98); box-shadow: 0 4px 30px -10px rgba(11, 47, 79, .18); }
[data-pb-theme="dark"] .pb-nav.is-scrolled .pb-nav-main { background: rgba(8, 23, 42, .98); }
.pb-nav-inner { display: flex; align-items: center; justify-content: space-between; height: 84px; gap: 24px; }

.pb-nav-items { display: flex; gap: 4px; }
.pb-nav-item { position: relative; }
.pb-nav-item > button {
  background: none; border: 0; cursor: pointer;
  padding: 10px 14px; font-size: 14px; font-weight: 500;
  color: var(--pb-ink); display: flex; align-items: center; gap: 6px;
  border-radius: 10px; transition: all .15s ease; font-family: inherit;
}
.pb-nav-item:hover > button,
.pb-nav-item.is-open > button { background: var(--pb-cream); color: var(--pb-primary); }
.pb-caret { font-size: 10px; opacity: .6; margin-left: 4px; }

.pb-nav-dropdown { position: absolute; top: calc(100% + 4px); left: -8px; min-width: 380px; background: var(--pb-paper); border: 1px solid var(--pb-line); border-radius: 16px; box-shadow: var(--pb-shadow-lg); padding: 12px; z-index: 70; }
.pb-nav-dropdown-grid { display: grid; gap: 4px; }
.pb-nav-dropdown-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; transition: background .12s ease; background: transparent; border: 0; cursor: pointer; font-family: inherit; color: inherit; text-align: left; width: 100%; }
.pb-nav-dropdown-item:hover { background: var(--pb-cream); }
.pb-nav-dropdown-item strong { display: block; font-size: 14px; font-weight: 600; color: var(--pb-primary); }
.pb-nav-dropdown-item em { display: block; font-style: normal; font-size: 12px; color: var(--pb-muted); margin-top: 2px; }
.pb-nav-dropdown-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pb-secondary); margin-top: 6px; flex-shrink: 0; }

.pb-nav-cta { display: flex; gap: 8px; align-items: center; }
.pb-burger { display: none; background: none; border: 0; cursor: pointer; padding: 10px; color: var(--pb-primary); }

@media (max-width: 1100px) {
  .pb-hide-md { display: none !important; }
  .pb-show-md { display: flex !important; }
  .pb-burger { display: flex; }
}

.pb-mobile-menu { background: var(--pb-paper); border-top: 1px solid var(--pb-line); padding: 16px 32px; max-height: 70vh; overflow: auto; }
.pb-mobile-menu details { padding: 8px 0; border-bottom: 1px solid var(--pb-line); }
.pb-mobile-menu summary { font-weight: 600; padding: 10px 0; cursor: pointer; }
.pb-mobile-menu a { display: block; padding: 8px 12px; color: var(--pb-muted); }

/* ========================================================================== */
/*  Ticker                                                                    */
/* ========================================================================== */
.pb-ticker { display: flex; align-items: stretch; background: var(--pb-primary); color: #d8e3f0; font-size: 13px; height: 44px; overflow: hidden; }
.pb-ticker-label { display: flex; align-items: center; gap: 8px; padding: 0 20px; background: var(--pb-primary-700); font-weight: 600; color: #fff; white-space: nowrap; flex-shrink: 0; }
.pb-ticker-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--pb-secondary); animation: pb-pulse 1.6s infinite; }
@keyframes pb-pulse { 0% { box-shadow: 0 0 0 0 rgba(108, 190, 70, .7); } 70% { box-shadow: 0 0 0 12px rgba(108, 190, 70, 0); } 100% { box-shadow: 0 0 0 0 rgba(108, 190, 70, 0); } }
.pb-ticker-track { flex: 1; overflow: hidden; position: relative; }
.pb-ticker-marquee { display: inline-flex; gap: 36px; padding: 0 24px; align-items: center; height: 100%; animation: pb-marquee 60s linear infinite; white-space: nowrap; }
@keyframes pb-marquee { from { transform: translateX(0); } to { transform: translateX(-33.33%); } }
.pb-ticker-item { display: flex; gap: 8px; align-items: baseline; }
.pb-ticker-code { font-weight: 700; color: #fff; }
.pb-ticker-bid { color: #cbd9e9; }
.pb-ticker-ask { color: #cbd9e9; opacity: .7; }
.pb-ticker-arrow.up { color: var(--pb-secondary); }
.pb-ticker-arrow.down { color: #ff8a8a; }

/* ========================================================================== */
/*  HERO SLIDER                                                               */
/* ========================================================================== */
.pb-hero-slider { position: relative; overflow: hidden; height: 720px; background: var(--pb-cream); }
@media (max-width: 980px) { .pb-hero-slider { height: auto; min-height: 720px; } }
.pb-hero-track { display: flex; height: 100%; width: 100%; transition: transform .8s cubic-bezier(.65, 0, .35, 1); }
.pb-hero-slide { flex: 0 0 100%; height: 100%; position: relative; overflow: hidden; display: flex; align-items: center; }

/* slide tints */
.pb-hero-slide-navy  { background: linear-gradient(135deg, var(--pb-primary) 0%, var(--pb-primary-300) 100%); color: #fff; }
.pb-hero-slide-green { background: linear-gradient(135deg, #2c6920 0%, var(--pb-secondary) 100%); color: #fff; }

.pb-hero-slide-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pb-hero-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
.pb-hero-slide.has-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,47,79,.85) 0%, rgba(11,47,79,.55) 45%, rgba(11,47,79,.2) 100%); }
.pb-hero-slide.has-bg .pb-container { position: relative; z-index: 2; }
.pb-hero-art-img { max-width: 100%; max-height: 420px; border-radius: 20px; object-fit: contain; box-shadow: 0 24px 60px rgba(11,47,79,.28); }
.pb-hero-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .35; }
.pb-hero-slide-navy  .pb-hero-blob-a { width: 540px; height: 540px; background: var(--pb-secondary); top: -180px; right: -120px; animation: pb-float 14s ease-in-out infinite; }
.pb-hero-slide-navy  .pb-hero-blob-b { width: 380px; height: 380px; background: #6cbe46; bottom: -160px; left: -80px; animation: pb-float 18s ease-in-out infinite reverse; }
.pb-hero-slide-green .pb-hero-blob-a { width: 540px; height: 540px; background: #0b2f4f; top: -180px; right: -120px; animation: pb-float 14s ease-in-out infinite; opacity: .25; }
.pb-hero-slide-green .pb-hero-blob-b { width: 380px; height: 380px; background: #ffffff; bottom: -160px; left: -80px; animation: pb-float 18s ease-in-out infinite reverse; opacity: .12; }
@keyframes pb-float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(40px, -30px); } }
.pb-hero-gridlines { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at top right, black, transparent 70%); }

.pb-hero-slide-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 64px; align-items: center; height: 100%; position: relative; }
@media (max-width: 980px) { .pb-hero-slide-grid { grid-template-columns: 1fr; padding: 80px 0; } }

.pb-hero-copy { opacity: 0; transform: translateY(20px); transition: all .8s ease .2s; }
.pb-hero-copy.is-in { opacity: 1; transform: translateY(0); }
.pb-hero-art { opacity: 0; transform: translateY(20px) scale(.96); transition: all 1s ease .35s; }
.pb-hero-art.is-in { opacity: 1; transform: translateY(0) scale(1); }

.pb-hero-slider .pb-hero-eyebrow {
  display: inline-flex; gap: 8px; align-items: center;
  background: rgba(255, 255, 255, .18);
  border: 1px solid rgba(255, 255, 255, .22);
  padding: 8px 16px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: #fff; letter-spacing: .6px;
  text-transform: uppercase;
}
.pb-hero-slider .pb-h1 { color: #fff; max-width: 640px; }
.pb-hero-sub { font-size: 18px; line-height: 1.55; color: rgba(255, 255, 255, .82); max-width: 520px; margin: 0 0 32px; }
.pb-hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }

/* Arrows */
.pb-hero-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); transition: all .2s ease; z-index: 5; }
.pb-hero-arrow:hover { background: rgba(255, 255, 255, .25); }
.pb-hero-arrow-prev { left: 24px; }
.pb-hero-arrow-next { right: 24px; }
@media (max-width: 720px) { .pb-hero-arrow { display: none; } }

/* Dots — labelled tab strip */
.pb-hero-dots { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 4; padding: 0 32px; }
.pb-hero-dot {
  background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 14px; padding: 12px 18px; cursor: pointer;
  color: rgba(255, 255, 255, .65); font-family: inherit;
  text-align: left; transition: all .25s ease; flex: 0 0 auto; min-width: 140px;
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px;
}
.pb-hero-dot em { font-style: normal; font-size: 11px; opacity: .6; grid-column: 1; grid-row: 1 / span 2; align-self: center; }
.pb-hero-dot strong { display: block; font-size: 12px; font-weight: 600; grid-column: 2; grid-row: 2; letter-spacing: .4px; }
.pb-hero-dot-track { display: block; width: 100%; height: 2px; background: rgba(255, 255, 255, .15); grid-column: 2; grid-row: 1; align-self: center; }
.pb-hero-dot-fill { display: block; width: 0; height: 100%; background: var(--pb-secondary); transition: width .3s ease; }
.pb-hero-dot.is-active { background: rgba(255, 255, 255, .14); color: #fff; }
.pb-hero-dot.is-active .pb-hero-dot-fill { width: 100%; animation: pb-dot-fill 6s linear; }
@keyframes pb-dot-fill { from { width: 0; } to { width: 100%; } }
@media (max-width: 720px) { .pb-hero-dots { display: none; } }

/* progress bar at bottom */
.pb-hero-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255, 255, 255, .1); }
.pb-hero-progress-bar { height: 100%; background: var(--pb-secondary); transition: width .8s ease; }

/* ========================================================================== */
/*  HERO ART                                                                  */
/* ========================================================================== */
.pb-art { position: relative; min-height: 480px; display: flex; align-items: center; justify-content: center; }
.pb-art-card { position: absolute; background: var(--pb-paper); border-radius: 16px; box-shadow: var(--pb-shadow-lg); padding: 14px 18px; display: flex; gap: 12px; align-items: center; color: var(--pb-ink); min-width: 240px; }
.pb-art-card strong { display: block; font-size: 15px; color: var(--pb-primary); }
.pb-art-card em { display: block; font-style: normal; font-size: 11px; color: var(--pb-muted); margin-top: 2px; }

/* Wallet art */
.pb-art-wallet .pb-art-card-tx { top: 40px; left: -32px; }
.pb-art-wallet .pb-art-card-rating { right: -32px; bottom: 80px; }

/* Card art */
.pb-art-card .pb-bcard { position: relative; }
.pb-art.pb-art-card .pb-bcard-elite    { transform: rotate(-6deg) translateX(-32px); z-index: 2; }
.pb-art.pb-art-card .pb-bcard-platinum { transform: rotate(4deg)  translate(32px, 60px); }

/* Swift art */
.pb-art-swift { position: relative; }
.pb-art-swift-card { top: 30px; right: 30px; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px 20px; }
.pb-art-swift-card em { font-style: normal; font-size: 11px; color: var(--pb-muted); }
.pb-art-swift-card strong { font-size: 22px; letter-spacing: 2px; font-family: 'Lexend'; color: var(--pb-primary); }
.pb-art-swift-card span { font-size: 11px; color: var(--pb-muted); }
.pb-art-swift-countries { bottom: 60px; left: -20px; }

/* Finance art */
.pb-finance-mock { background: var(--pb-paper); border-radius: 24px; padding: 28px; box-shadow: var(--pb-shadow-lg); width: 100%; max-width: 480px; color: var(--pb-ink); }
.pb-finance-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.pb-finance-head strong { color: var(--pb-primary); }
.pb-pill { background: var(--pb-secondary-100); color: var(--pb-secondary-700); padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.pb-pill-green { background: var(--pb-secondary); color: #fff; }
.pb-finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 0; border-top: 1px solid var(--pb-line); border-bottom: 1px solid var(--pb-line); }
.pb-finance-grid em { font-style: normal; font-size: 11px; color: var(--pb-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
.pb-finance-grid strong { font-size: 22px; color: var(--pb-primary); font-weight: 600; }
.pb-finance-bar { display: flex; gap: 4px; height: 36px; margin: 16px 0 12px; border-radius: 8px; overflow: hidden; }
.pb-finance-bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; }
.pb-finance-bar div:first-child { background: var(--pb-primary); }
.pb-finance-bar div:last-child { background: var(--pb-secondary); }
.pb-finance-note { font-size: 12px; color: var(--pb-muted); margin: 0; }
.pb-art-finance-tag { bottom: 30px; right: -20px; }

/* Agency art */
.pb-art-agency-tag { bottom: 60px; right: -20px; }

/* ========================================================================== */
/*  Stats bar                                                                 */
/* ========================================================================== */
.pb-stats-bar { background: var(--pb-paper); border-bottom: 1px solid var(--pb-line); padding: 32px 0; }
.pb-stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
@media (max-width: 880px) { .pb-stats-grid { grid-template-columns: repeat(2, 1fr); } }
.pb-stat { text-align: center; }
.pb-stat strong { display: block; font-size: clamp(24px, 3vw, 36px); font-weight: 600; color: var(--pb-primary); letter-spacing: -1px; line-height: 1; }
.pb-stat span { font-size: 12px; color: var(--pb-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; display: block; }

/* ========================================================================== */
/*  Values grid                                                               */
/* ========================================================================== */
.pb-values-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
@media (max-width: 980px) { .pb-values-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 580px) { .pb-values-grid { grid-template-columns: 1fr; } }
.pb-value-card { background: var(--pb-paper); border: 1px solid var(--pb-line); border-radius: var(--pb-radius); padding: 28px 24px; transition: all .25s ease; display: flex; flex-direction: column; gap: 12px; }
.pb-value-card:hover { transform: translateY(-3px); border-color: var(--pb-secondary); box-shadow: var(--pb-shadow); }
.pb-value-card h3 { font-size: 17px; font-weight: 600; color: var(--pb-primary); margin: 0; }
.pb-value-card p { font-size: 13px; line-height: 1.55; color: var(--pb-muted); margin: 0; }

/* ========================================================================== */
/*  Accounts showcase                                                         */
/* ========================================================================== */
.pb-accounts-section { background: var(--pb-cream); }
.pb-accounts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 1024px) { .pb-accounts-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px)  { .pb-accounts-grid { grid-template-columns: repeat(2, 1fr); } }
.pb-account-card {
  background: var(--pb-paper); border: 1px solid var(--pb-line);
  border-radius: var(--pb-radius); padding: 24px 20px;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
  cursor: pointer; transition: all .2s ease; position: relative;
  font-family: inherit; color: inherit; text-align: left;
}
.pb-account-card:hover { transform: translateY(-3px); border-color: var(--pb-secondary); box-shadow: var(--pb-shadow); }
.pb-account-card strong { font-size: 16px; color: var(--pb-primary); font-weight: 600; margin-top: 12px; }
.pb-account-card em { font-size: 12px; color: var(--pb-muted); font-style: normal; }
.pb-account-arrow { position: absolute; top: 24px; right: 20px; color: var(--pb-secondary-700); opacity: 0; transition: opacity .15s ease; }
.pb-account-card:hover .pb-account-arrow { opacity: 1; }

/* ========================================================================== */
/*  Cards showcase                                                            */
/* ========================================================================== */
.pb-cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }
@media (max-width: 880px) { .pb-cards-grid { grid-template-columns: 1fr; } }
.pb-card-tile { background: var(--pb-paper); border-radius: var(--pb-radius-lg); overflow: hidden; box-shadow: var(--pb-shadow); display: grid; grid-template-columns: 240px 1fr; }
@media (max-width: 720px) { .pb-card-tile { grid-template-columns: 1fr; } }
.pb-card-tile-card { background: linear-gradient(135deg, color-mix(in srgb, var(--card-bg, #0b2f4f) 85%, #000), var(--card-bg, #0b2f4f)); display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.pb-card-tile-body { padding: 28px; display: flex; flex-direction: column; gap: 8px; }
.pb-card-tile-body h3 { font-size: 22px; font-weight: 600; color: var(--pb-primary); margin: 0; letter-spacing: -.3px; }
.pb-card-tile-body p { font-size: 13px; line-height: 1.55; color: var(--pb-muted); margin: 0 0 8px; }
.pb-card-tile-meta { display: grid; gap: 6px; font-size: 12px; color: var(--pb-muted); margin: 8px 0; }
.pb-card-tile-meta span { display: flex; align-items: center; gap: 8px; }
.pb-card-tile .pb-link-arrow { margin-top: auto; }

/* Bank card visual */
.pb-bcard { position: relative; width: 200px; height: 124px; border-radius: 10px; padding: 14px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 12px 24px -8px rgba(0,0,0,.4); overflow: hidden; }
.pb-bcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 80% 0%, rgba(255,255,255,.18), transparent 50%); }
.pb-bcard-lg { width: 200px; height: 124px; }
.pb-bcard-elite    { background: linear-gradient(135deg, #0a2540 0%, #1a4a73 100%); }
.pb-bcard-platinum { background: linear-gradient(135deg, #404956 0%, #8c95a3 100%); }
.pb-bcard-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
.pb-bcard-chip { width: 26px; height: 20px; background: linear-gradient(135deg, #d4af37 0%, #f4e4a1 100%); border-radius: 4px; }
.pb-bcard-num { font-size: 12px; letter-spacing: 1.5px; font-weight: 500; position: relative; }
.pb-bcard-foot { display: flex; gap: 12px; align-items: flex-end; font-size: 9px; position: relative; }
.pb-bcard-foot em { font-style: normal; opacity: .6; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 2px; }
.pb-bcard-foot strong { font-size: 11px; }
.pb-bcard-foot > span { display: flex; flex-direction: column; }
.pb-bcard-foot .pb-bcard-mc { margin-left: auto; }
.pb-bcard-tier { position: absolute; top: 14px; right: 50px; font-size: 8px; letter-spacing: 1px; opacity: .7; }

/* Big card variants (in Hero Art) */
.pb-art-card .pb-bcard { width: 280px; height: 175px; padding: 20px; border-radius: 16px; }
.pb-art-card .pb-bcard-chip { width: 38px; height: 28px; border-radius: 5px; }
.pb-art-card .pb-bcard-num { font-size: 15px; letter-spacing: 2px; }
.pb-art-card .pb-bcard-foot { font-size: 10px; }
.pb-art-card .pb-bcard-foot strong { font-size: 12px; }
.pb-art-card .pb-bcard-tier { font-size: 9px; right: 60px; top: 20px; }

/* ========================================================================== */
/*  Wallet section                                                            */
/* ========================================================================== */
.pb-wallet-section { background: var(--pb-primary); color: #fff; position: relative; overflow: hidden; }
.pb-wallet-section::before { content: ""; position: absolute; right: -200px; top: 50%; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(108, 190, 70, .2), transparent 70%); transform: translateY(-50%); }
.pb-wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; position: relative; }
@media (max-width: 980px) { .pb-wallet-grid { grid-template-columns: 1fr; } }
.pb-wallet-copy p { color: rgba(255, 255, 255, .82); font-size: 17px; line-height: 1.6; margin: 0 0 28px; }
.pb-wallet-feat { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.pb-wallet-feat > div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.pb-wallet-visual { position: relative; display: flex; justify-content: center; }
.pb-wallet-floater { position: absolute; background: var(--pb-paper); color: var(--pb-ink); padding: 12px 14px; border-radius: 14px; display: flex; gap: 10px; align-items: center; box-shadow: var(--pb-shadow-lg); animation: pb-bob 4s ease-in-out infinite; min-width: 200px; }
.pb-wallet-floater-a { top: 80px; left: 0; }
.pb-wallet-floater-b { bottom: 100px; right: 0; animation-delay: 1.5s; }
@keyframes pb-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.pb-wallet-floater strong { display: block; font-size: 13px; color: var(--pb-primary); }
.pb-wallet-floater em { display: block; font-style: normal; font-size: 11px; color: var(--pb-muted); }
.pb-wallet-rating { position: absolute; top: 0; right: 0; background: var(--pb-secondary); color: var(--pb-primary); padding: 8px 14px; border-radius: 999px; font-size: 12px; display: flex; gap: 6px; align-items: center; box-shadow: var(--pb-shadow); }
.pb-wallet-rating strong { font-weight: 700; }
.pb-wallet-rating span { opacity: .8; font-size: 10px; }

/* ========================================================================== */
/*  Phone                                                                     */
/* ========================================================================== */
.pb-phone { width: 320px; height: 640px; }
.pb-phone.is-small { transform: scale(.85); transform-origin: center; }
.pb-phone-frame { width: 100%; height: 100%; background: #1a1a1a; border-radius: 44px; padding: 8px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.4); position: relative; }
.pb-phone-notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: #1a1a1a; border-radius: 999px; z-index: 2; }
.pb-phone-screen { width: 100%; height: 100%; background: #f7f4ee; border-radius: 36px; padding: 56px 18px 14px; overflow: hidden; }
.pb-phone-status { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--pb-primary); padding: 0 4px; }
.pb-phone-greet { display: flex; justify-content: space-between; align-items: center; margin: 16px 4px 14px; }
.pb-phone-greet p { margin: 0; font-size: 11px; color: var(--pb-muted); }
.pb-phone-greet h4 { margin: 2px 0 0; font-size: 16px; font-weight: 600; color: var(--pb-primary); }
.pb-phone-logo { width: 36px; height: 36px; border-radius: 50%; background: rgba(108,190,70,.15); display: flex; align-items: center; justify-content: center; }
.pb-phone-balance { background: var(--pb-primary); color: #fff; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.pb-phone-balance > span { font-size: 11px; opacity: .6; text-transform: uppercase; letter-spacing: 1px; }
.pb-phone-balance > strong { display: block; font-size: 32px; font-weight: 600; margin: 6px 0 0; letter-spacing: -.5px; }
.pb-phone-balance > strong sup { font-size: 16px; opacity: .6; }
.pb-phone-balance-foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; align-items: center; }
.pb-phone-pill { background: var(--pb-secondary); color: var(--pb-primary); padding: 3px 8px; border-radius: 999px; font-weight: 700; font-size: 10px; }
.pb-phone-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
.pb-phone-actions button { background: var(--pb-paper); border: 0; padding: 10px 4px; border-radius: 14px; font-size: 10px; color: var(--pb-primary); display: flex; flex-direction: column; gap: 4px; align-items: center; cursor: pointer; font-family: inherit; }
.pb-phone-section { display: flex; justify-content: space-between; padding: 0 4px 8px; font-size: 11px; }
.pb-phone-section span { font-weight: 600; color: var(--pb-primary); }
.pb-phone-section a { color: var(--pb-secondary-700); }
.pb-phone-tx { background: var(--pb-paper); border-radius: 18px; padding: 4px 12px; }
.pb-phone-tx-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--pb-line); }
.pb-phone-tx-row:last-child { border: 0; }
.pb-phone-tx-icon { width: 30px; height: 30px; border-radius: 50%; background: rgba(11,47,79,.06); display: flex; align-items: center; justify-content: center; }
.pb-phone-tx-meta { flex: 1; }
.pb-phone-tx-meta strong { display: block; font-size: 12px; color: var(--pb-primary); }
.pb-phone-tx-meta em { display: block; font-style: normal; font-size: 10px; color: var(--pb-muted); }
.pb-phone-tx-amt { font-size: 12px; font-weight: 600; }
.pb-phone-tx-amt.in { color: var(--pb-secondary-700); }
.pb-phone-tx-amt.out { color: var(--pb-primary); }
.pb-phone-tabbar { position: absolute; bottom: 12px; left: 18px; right: 18px; background: var(--pb-paper); border-radius: 24px; display: flex; justify-content: space-around; padding: 12px 16px; box-shadow: 0 10px 24px -8px rgba(0,0,0,.1); font-size: 11px; color: var(--pb-muted); }
.pb-phone-tabbar .active { color: var(--pb-secondary-700); font-weight: 700; }

/* ========================================================================== */
/*  MORE SERVICES — Blinq-inspired tile grid                                  */
/* ========================================================================== */
.pb-more-services { background: var(--pb-cream); }
.pb-more-head { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: end; margin-bottom: 48px; }
@media (max-width: 780px) { .pb-more-head { grid-template-columns: 1fr; } }
.pb-more-head h2 { font-size: clamp(36px, 4.5vw, 64px); line-height: 1.02; letter-spacing: -1.5px; margin: 12px 0 0; font-weight: 600; font-family: "Lexend", serif; color: var(--pb-primary); }
.pb-more-head p { color: var(--pb-muted); font-size: 16px; line-height: 1.5; margin: 0; max-width: 420px; justify-self: end; }
@media (max-width: 780px) { .pb-more-head p { justify-self: start; } }

.pb-tiles-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1024px) { .pb-tiles-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px)  { .pb-tiles-grid { grid-template-columns: repeat(2, 1fr); } }

.pb-tile {
  position: relative; aspect-ratio: 1 / 1; border-radius: 18px;
  border: 0; cursor: pointer; padding: 14px; overflow: hidden;
  display: flex; flex-direction: column; color: var(--pb-primary);
  font-family: inherit; text-align: left;
  transition: all .25s ease;
}
.pb-tile:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -16px rgba(11, 47, 79, .25); }
.pb-tile-art { flex: 1; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); position: relative; }
.pb-tile[style*="#f3edde"] .pb-tile-art,
.pb-tile[style*="#e9efe2"] .pb-tile-art,
.pb-tile[style*="#f7f4ee"] .pb-tile-art { background: rgba(11,47,79,.04); }
.pb-tile-foot { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 6px 6px; gap: 12px; }
.pb-tile-foot strong { display: block; font-size: 17px; font-weight: 600; font-family: "Lexend", serif; letter-spacing: -.2px; }
.pb-tile-foot em { display: block; font-style: normal; font-size: 12px; opacity: .8; margin-top: 4px; line-height: 1.4; }
.pb-tile[style*="#0b2f4f"] .pb-tile-foot,
.pb-tile[style*="#1a4a73"] .pb-tile-foot { color: #fff; }
.pb-tile[style*="#6cbe46"] .pb-tile-foot { color: var(--pb-primary); }
.pb-tile-arrow { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--pb-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .2s ease; }
.pb-tile:hover .pb-tile-arrow { transform: translateX(4px); }

/* CTA tile */
.pb-tile-cta { background: var(--pb-secondary); color: var(--pb-primary); aspect-ratio: 1 / 1; }
.pb-tile-cta-inner { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 12px; }
.pb-tile-cta-inner h3 { font-size: clamp(22px, 2.4vw, 32px); line-height: 1; font-weight: 600; font-family: "Lexend", serif; letter-spacing: -.8px; margin: 0; color: var(--pb-primary); }
.pb-tile-cta-arrow { align-self: flex-end; width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }

/* Tile illustrations */
.pb-tile-illus { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 18px; }

/* Mini phone (in wallet tile) */
.pb-mini-phone { width: 100%; max-width: 180px; background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 10px; }
.pb-mini-phone-head { display: flex; align-items: center; justify-content: space-between; }
.pb-mini-phone-head span { width: 30px; height: 10px; background: rgba(11,47,79,.1); border-radius: 4px; }
.pb-mini-phone-bal { background: var(--pb-primary); color: #fff; border-radius: 10px; padding: 10px; }
.pb-mini-phone-bal em { display: block; font-style: normal; font-size: 8px; opacity: .6; text-transform: uppercase; letter-spacing: 1px; }
.pb-mini-phone-bal strong { display: block; font-size: 18px; font-weight: 600; margin-top: 2px; }
.pb-mini-phone-bal strong sup { font-size: 10px; opacity: .7; }
.pb-mini-phone-bal span { font-size: 9px; opacity: .7; display: block; margin-top: 2px; }
.pb-mini-phone-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pb-mini-phone-acts > span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pb-mini-phone-acts em { font-style: normal; font-size: 8px; color: var(--pb-muted); }

/* Mini card */
.pb-mini-card { position: absolute; width: 70%; aspect-ratio: 16/10; border-radius: 12px; padding: 12px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 16px 32px rgba(0,0,0,.25); }
.pb-mini-card-front { background: linear-gradient(135deg, #0a2540, #1a4a73); transform: rotate(-6deg) translateY(-10%); z-index: 2; }
.pb-mini-card-back  { background: linear-gradient(135deg, #404956, #8c95a3); transform: rotate(6deg) translateY(10%); }
.pb-mini-card-row { display: flex; justify-content: space-between; align-items: flex-start; }
.pb-mini-card-chip { width: 22px; height: 16px; background: linear-gradient(135deg, #d4af37, #f4e4a1); border-radius: 3px; }
.pb-mini-card-num { font-size: 10px; letter-spacing: 1.5px; font-weight: 500; }
.pb-mini-card-foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 8px; }

/* ========================================================================== */
/*  Trust strip                                                               */
/* ========================================================================== */
.pb-trust { padding: 48px 0; border-top: 1px solid var(--pb-line); border-bottom: 1px solid var(--pb-line); background: var(--pb-paper); }
.pb-trust-label { text-align: center; font-size: 13px; color: var(--pb-muted); margin: 0 0 24px; }
.pb-trust-grid { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: center; }
.pb-trust-grid span { font-size: 14px; font-weight: 700; letter-spacing: 1px; color: var(--pb-muted); opacity: .65; transition: opacity .2s ease; }
.pb-trust-grid span:hover { opacity: 1; color: var(--pb-primary); }

/* ========================================================================== */
/*  Branch locator                                                            */
/* ========================================================================== */
.pb-locator-section { background: var(--pb-cream); }
.pb-locator { display: grid; grid-template-columns: 360px 1fr; gap: 24px; background: var(--pb-paper); padding: 24px; border-radius: var(--pb-radius-lg); box-shadow: var(--pb-shadow); }
@media (max-width: 880px) { .pb-locator { grid-template-columns: 1fr; } }
.pb-locator-filter { display: flex; gap: 4px; padding: 4px; background: var(--pb-cream); border-radius: 999px; margin-bottom: 12px; }
.pb-locator-filter button { flex: 1; background: transparent; border: 0; padding: 8px 12px; border-radius: 999px; font-weight: 500; font-size: 13px; color: var(--pb-muted); cursor: pointer; font-family: inherit; }
.pb-locator-filter button.is-active { background: var(--pb-primary); color: #fff; }
.pb-locator-items { max-height: 480px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.pb-locator-item { background: transparent; border: 0; text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; transition: background .15s ease; font-family: inherit; color: inherit; }
.pb-locator-item:hover { background: var(--pb-cream); }
.pb-locator-item.is-active { background: var(--pb-primary); color: #fff; }
.pb-locator-item.is-active em { color: rgba(255, 255, 255, .7); }
.pb-locator-item.is-active .pb-locator-count { background: var(--pb-secondary); color: var(--pb-primary); }
.pb-locator-pin { display: inline-flex; }
.pb-locator-item strong { display: block; font-size: 14px; }
.pb-locator-item em { display: block; font-style: normal; font-size: 11px; color: var(--pb-muted); margin-top: 2px; }
.pb-locator-count { margin-left: auto; background: var(--pb-secondary-100); color: var(--pb-secondary-700); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }

.pb-locator-map { position: relative; background: var(--pb-cream); border-radius: var(--pb-radius); aspect-ratio: 4/3; min-height: 480px; }
.pb-locator-svg { width: 100%; height: 100%; }
.pb-locator-pin-btn { position: absolute; transform: translate(-50%, -50%); background: transparent; border: 0; cursor: pointer; padding: 0; }
.pb-locator-ping { position: absolute; inset: -8px; border-radius: 50%; background: rgba(11, 47, 79, .2); animation: pb-ping 2s infinite; }
.pb-locator-pin-btn.is-intl .pb-locator-ping { background: rgba(108, 190, 70, .3); }
@keyframes pb-ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.4); opacity: 0; } }
.pb-locator-dot { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--pb-primary); border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.pb-locator-pin-btn.is-intl .pb-locator-dot { background: var(--pb-secondary); }
.pb-locator-pin-btn.is-active .pb-locator-dot { transform: scale(1.4); }
.pb-locator-tip { position: absolute; left: 50%; top: -52px; transform: translateX(-50%); background: var(--pb-primary); color: #fff; padding: 8px 12px; border-radius: 10px; white-space: nowrap; font-size: 12px; box-shadow: var(--pb-shadow); }
.pb-locator-tip strong { display: block; }
.pb-locator-tip em { display: block; font-style: normal; font-size: 11px; opacity: .7; }
.pb-locator-tip::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: var(--pb-primary); }
.pb-locator-legend { position: absolute; bottom: 16px; left: 16px; background: var(--pb-paper); border-radius: 8px; padding: 8px 12px; display: flex; gap: 16px; font-size: 11px; color: var(--pb-muted); }
.pb-locator-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.pb-locator-legend i.dom { background: var(--pb-primary); }
.pb-locator-legend i.intl { background: var(--pb-secondary); }

/* ========================================================================== */
/*  Testimonials                                                              */
/* ========================================================================== */
.pb-testimonials { background: var(--pb-warm); }
.pb-test-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 880px) { .pb-test-grid { grid-template-columns: 1fr; } }
.pb-test-card { background: var(--pb-paper); padding: 28px; border-radius: var(--pb-radius-lg); box-shadow: var(--pb-shadow); position: relative; display: flex; flex-direction: column; gap: 16px; }
.pb-test-card-1 { background: var(--pb-primary); color: #fff; }
.pb-test-card-1 p { color: rgba(255, 255, 255, .9); }
.pb-test-card-3 { background: var(--pb-secondary); color: var(--pb-primary); }
.pb-test-quote { font-family: "Lexend", serif; font-size: 80px; line-height: .8; color: var(--pb-secondary); opacity: .4; }
.pb-test-card-1 .pb-test-quote { color: rgba(255, 255, 255, .4); }
.pb-test-card p { font-size: 16px; line-height: 1.55; flex: 1; margin: 0; }
.pb-test-foot { display: flex; gap: 12px; align-items: center; }
.pb-test-foot strong { display: block; font-size: 13px; }
.pb-test-foot em { display: block; font-style: normal; font-size: 11px; color: var(--pb-muted); }
.pb-test-card-1 .pb-test-foot em { color: rgba(255, 255, 255, .65); }
.pb-stars { margin-left: auto; display: flex; gap: 1px; color: var(--pb-secondary); }
.pb-test-card-3 .pb-stars { color: #fff; }
.pb-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--pb-secondary); color: var(--pb-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }

/* ========================================================================== */
/*  Security                                                                  */
/* ========================================================================== */
.pb-security { background: var(--pb-primary); color: #fff; }
.pb-security-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
@media (max-width: 880px) { .pb-security-grid { grid-template-columns: 1fr; } }
.pb-security p { color: rgba(255, 255, 255, .8); font-size: 17px; line-height: 1.6; margin: 16px 0 0; }
.pb-security-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pb-security-pill { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
.pb-security-pill strong { display: block; font-size: 16px; }
.pb-security-pill em { display: block; font-style: normal; font-size: 13px; color: rgba(255, 255, 255, .65); }

/* ========================================================================== */
/*  FAQ                                                                       */
/* ========================================================================== */
.pb-faq-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 64px; align-items: flex-start; }
@media (max-width: 880px) { .pb-faq-grid { grid-template-columns: 1fr; } }
.pb-faq h2 { font-size: 36px; line-height: 1.1; letter-spacing: -.6px; margin: 12px 0 16px; font-weight: 600; color: var(--pb-primary); }
.pb-faq p { color: var(--pb-muted); line-height: 1.55; margin: 0 0 24px; }
.pb-faq-contact { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.pb-faq-list details { background: var(--pb-paper); border-radius: 14px; padding: 18px 24px; margin-bottom: 8px; box-shadow: var(--pb-shadow); cursor: pointer; }
.pb-faq-list summary { display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--pb-primary); list-style: none; gap: 16px; font-size: 16px; }
.pb-faq-list summary::-webkit-details-marker { display: none; }
.pb-faq-plus { width: 28px; height: 28px; border-radius: 50%; background: var(--pb-secondary-100); color: var(--pb-secondary-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pb-faq-list p { padding-top: 12px; margin: 0; line-height: 1.6; }

/* ========================================================================== */
/*  CTA closer                                                                */
/* ========================================================================== */
.pb-cta-closer { padding-bottom: calc(110px * var(--pb-density)); }
.pb-cta-card { background: linear-gradient(135deg, var(--pb-primary) 0%, var(--pb-primary-300) 100%); color: #fff; border-radius: var(--pb-radius-lg); padding: 64px; position: relative; overflow: hidden; box-shadow: var(--pb-shadow-lg); }
.pb-cta-card-bg { position: absolute; right: -120px; top: 50%; transform: translateY(-50%); opacity: .06; pointer-events: none; }
.pb-cta-card-inner { position: relative; max-width: 720px; }
.pb-cta-card p { color: rgba(255, 255, 255, .85); font-size: 17px; line-height: 1.55; margin: 0 0 24px; }
@media (max-width: 880px) { .pb-cta-card { padding: 48px 32px; } }

/* ========================================================================== */
/*  Footer                                                                    */
/* ========================================================================== */
.pb-footer { background: var(--pb-primary-700); color: #cdd8e4; padding: 80px 0 24px; }
.pb-footer-top { display: grid; grid-template-columns: 1.2fr 3fr; gap: 48px; padding-bottom: 48px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
@media (max-width: 880px) { .pb-footer-top { grid-template-columns: 1fr; } }
.pb-footer-brand p { font-size: 13px; line-height: 1.6; margin: 16px 0 24px; max-width: 360px; }
.pb-footer-app { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.pb-store { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: 10px; padding: 8px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; transition: background .15s ease; }
.pb-store:hover { background: rgba(255, 255, 255, .12); }
.pb-store > span:first-child { display: inline-flex; }
.pb-store > span:last-child em { display: block; font-size: 9px; opacity: .7; font-style: normal; }
.pb-store > span:last-child strong { display: block; font-size: 13px; color: #fff; }
.pb-footer-social { display: flex; gap: 8px; }
.pb-footer-social a { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .06); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; transition: background .15s ease; cursor: pointer; }
.pb-footer-social a:hover { background: var(--pb-secondary); color: var(--pb-primary); }
.pb-footer-cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
@media (max-width: 880px) { .pb-footer-cols { grid-template-columns: repeat(2, 1fr); } }
.pb-footer-cols h5 { font-size: 13px; color: #fff; font-weight: 600; margin: 0 0 12px; }
.pb-footer-cols a { display: block; font-size: 13px; color: #9bb1c8; padding: 4px 0; }
.pb-footer-cols a:hover { color: var(--pb-secondary); }
.pb-footer-bottom { padding-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; font-size: 12px; color: rgba(255, 255, 255, .5); }
.pb-footer-trust { display: flex; gap: 16px; flex-wrap: wrap; }
.pb-footer-trust span { background: rgba(255, 255, 255, .05); padding: 4px 10px; border-radius: 999px; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; }

/* ---- Responsive: CTA closer + footer + section rhythm (all screens) ---- */
@media (max-width: 1024px) {
  .pb-section { padding: 84px 0; }
}
@media (max-width: 768px) {
  .pb-section { padding: 60px 0; }
  .pb-cta-card { padding: 44px 28px; }
  .pb-cta-card-inner { max-width: 100%; }
  .pb-footer { padding: 56px 0 24px; }
  .pb-footer-top { gap: 32px; padding-bottom: 36px; }
}
@media (max-width: 560px) {
  .pb-container { padding: 0 18px; }
  .pb-section { padding: 44px 0; }
  .pb-cta-card { padding: 32px 20px; border-radius: 20px; }
  .pb-cta-card-bg { right: -180px; }
  .pb-cta-card .pb-hero-ctas { flex-direction: column; align-items: stretch; gap: 10px; }
  .pb-cta-card .pb-hero-ctas .pb-btn { width: 100%; justify-content: center; }
  .pb-footer { padding: 40px 0 20px; }
  .pb-footer-cols { grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .pb-footer-bottom { flex-direction: column; align-items: flex-start; gap: 12px; }
}
@media (max-width: 380px) {
  .pb-footer-cols { grid-template-columns: 1fr; }
}

/* ========================================================================== */
/*  Login modal                                                               */
/* ========================================================================== */
.pb-modal-bg { position: fixed; inset: 0; background: rgba(11, 47, 79, .65); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: pb-fadeIn .2s ease; }
@keyframes pb-fadeIn { from { opacity: 0; } to { opacity: 1; } }
.pb-modal { background: var(--pb-paper); border-radius: 24px; max-width: 880px; width: 100%; box-shadow: var(--pb-shadow-lg); position: relative; overflow: hidden; animation: pb-pop .25s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pb-pop { from { transform: scale(.95) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.pb-modal-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .18); border: 0; cursor: pointer; color: #fff; z-index: 2; display: flex; align-items: center; justify-content: center; }
.pb-modal-grid { display: grid; grid-template-columns: 1fr 1.1fr; min-height: 560px; }
@media (max-width: 720px) { .pb-modal-grid { grid-template-columns: 1fr; } }
.pb-modal-side { background: linear-gradient(135deg, var(--pb-primary) 0%, var(--pb-primary-300) 100%); color: #fff; padding: 40px; display: flex; flex-direction: column; gap: 16px; }
.pb-modal-side h3 { font-size: 28px; font-weight: 600; margin: 16px 0 0; line-height: 1.1; letter-spacing: -.4px; }
.pb-modal-side p { color: rgba(255, 255, 255, .8); font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
.pb-modal-side ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 13px; color: rgba(255, 255, 255, .85); }
.pb-modal-side li { display: flex; align-items: center; gap: 8px; }
.pb-modal-trust { margin-top: auto; font-size: 11px; color: rgba(255, 255, 255, .6); padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .1); }
.pb-modal-form { padding: 40px; display: flex; flex-direction: column; gap: 14px; }
.pb-modal-tabs { display: flex; gap: 0; background: var(--pb-cream); border-radius: 999px; padding: 4px; margin-bottom: 8px; }
.pb-modal-tabs button { flex: 1; background: transparent; border: 0; padding: 10px; border-radius: 999px; font-weight: 600; cursor: pointer; color: var(--pb-muted); font-size: 13px; font-family: inherit; }
.pb-modal-tabs button.is-active { background: var(--pb-primary); color: #fff; }
.pb-modal-form label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--pb-muted); font-weight: 500; }
.pb-modal-form input { padding: 14px 16px; border: 1px solid var(--pb-line); border-radius: 12px; font-size: 15px; background: var(--pb-paper); color: var(--pb-ink); outline: none; transition: border-color .15s ease; }
.pb-modal-form input:focus { border-color: var(--pb-primary); }
.pb-modal-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.pb-checkbox { display: flex; gap: 6px; align-items: center; cursor: pointer; flex-direction: row !important; color: var(--pb-ink); font-weight: 400 !important; }
.pb-modal-row a { color: var(--pb-secondary-700); font-weight: 600; }
.pb-modal-foot { font-size: 12px; color: var(--pb-muted); text-align: center; margin: 8px 0 0; }
.pb-modal-foot a { color: var(--pb-primary); font-weight: 600; }

/* ========================================================================== */
/*  Detail panel                                                              */
/* ========================================================================== */
.pb-detail-bg { position: fixed; inset: 0; background: rgba(11, 47, 79, .55); backdrop-filter: blur(6px); z-index: 110; display: flex; justify-content: center; animation: pb-fadeIn .2s ease; }
.pb-detail-panel { width: 100vw; height: 100vh; background: var(--pb-paper); position: relative; overflow: hidden; box-shadow: none; animation: pb-page-in .32s cubic-bezier(.22, 1, .36, 1); display: flex; flex-direction: column; }
@keyframes pb-slide-in { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes pb-page-in { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.pb-detail-close { position: absolute; top: 20px; right: 20px; width: 42px; height: 42px; border-radius: 999px; background: rgba(255, 255, 255, .9); color: var(--pb-primary); border: 1px solid rgba(11, 47, 79, .08); cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; transition: transform .15s ease, background .15s ease; }
.pb-detail-close:hover { transform: rotate(90deg); background: #fff; }
.pb-detail-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

.pb-detail-hero { position: relative; padding: 72px 64px 56px; color: #fff; overflow: hidden; }
.pb-detail-primary .pb-detail-hero   { background: linear-gradient(135deg, var(--pb-primary) 0%, var(--pb-primary-300) 100%); }
.pb-detail-secondary .pb-detail-hero { background: linear-gradient(135deg, #0b2f4f 0%, var(--pb-secondary-700) 50%, var(--pb-secondary) 100%); }
.pb-detail-crumb { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: rgba(255, 255, 255, .7); margin-bottom: 18px; position: relative; z-index: 2; }
.pb-crumb-sep { color: rgba(255, 255, 255, .4); }
.pb-detail-hero-icon { position: relative; z-index: 2; margin-bottom: 16px; }
.pb-detail-hero-icon .pb-icon-circle { background: rgba(255,255,255,.15) !important; color: #fff !important; }
.pb-detail-eyebrow { display: inline-block; font-size: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .25); margin: 0 0 16px; color: #fff; letter-spacing: .4px; position: relative; z-index: 2; }
.pb-detail-title { font-family: 'Lexend', sans-serif; font-size: clamp(40px, 5vw, 64px); font-weight: 600; letter-spacing: -1.2px; line-height: 1.02; margin: 0 0 18px; max-width: 900px; position: relative; z-index: 2; text-wrap: balance; }
.pb-detail-tagline { font-size: 17px; line-height: 1.55; color: rgba(255, 255, 255, .85); max-width: 720px; margin: 0 0 28px; position: relative; z-index: 2; text-wrap: pretty; }
.pb-detail-cta-row { display: flex; gap: 12px; flex-wrap: wrap; position: relative; z-index: 2; margin-bottom: 40px; }
.pb-detail-highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 720px; position: relative; z-index: 2; }
.pb-detail-stat { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); border-radius: 16px; padding: 18px 20px; backdrop-filter: blur(8px); }
.pb-detail-stat strong { display: block; font-family: 'Lexend', sans-serif; font-size: 24px; font-weight: 600; color: #fff; letter-spacing: -.4px; line-height: 1.1; margin-bottom: 4px; }
.pb-detail-stat span { font-size: 12px; color: rgba(255, 255, 255, .7); }
.pb-detail-hero-shapes { position: absolute; inset: 0; pointer-events: none; }
.pb-detail-blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .3; }
.pb-detail-blob.a { width: 380px; height: 380px; background: var(--pb-secondary); top: -120px; right: -80px; }
.pb-detail-blob.b { width: 260px; height: 260px; background: #fff; bottom: -100px; right: 200px; opacity: .08; }
.pb-detail-grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at top right, black, transparent 70%); }
.pb-detail-watermark { position: absolute; right: -100px; bottom: -120px; opacity: .07; }

.pb-detail-section { padding: 64px 64px; }
.pb-detail-section-alt { background: var(--pb-cream); }
.pb-detail-section-head { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
.pb-detail-sec-num { font-family: 'Lexend', monospace; font-size: 12px; color: var(--pb-secondary-700); letter-spacing: 1px; padding: 4px 10px; background: var(--pb-secondary-100); border-radius: 6px; font-weight: 600; }
.pb-detail-section-head h2 { font-family: 'Lexend', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -.6px; color: var(--pb-ink); margin: 0; }

.pb-detail-features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.pb-detail-feat { background: var(--pb-paper); border: 1px solid var(--pb-line); border-radius: 18px; padding: 28px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.pb-detail-feat:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(11, 47, 79, .08); border-color: rgba(11, 47, 79, .15); }
.pb-detail-feat h3 { font-family: 'Lexend', sans-serif; font-size: 18px; font-weight: 600; color: var(--pb-ink); margin: 16px 0 8px; letter-spacing: -.2px; }
.pb-detail-feat p { font-size: 14px; line-height: 1.55; color: var(--pb-muted); margin: 0; }

/* ATM directory */
.pb-atm-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.pb-atm-search { flex: 1; min-width: 220px; font-family: 'Lexend', sans-serif; font-size: 14px; padding: 11px 14px; border: 1px solid var(--pb-line); border-radius: 12px; background: #fff; }
.pb-atm-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.pb-atm-filters button { border: 1px solid var(--pb-line); background: #fff; color: var(--pb-muted); font-family: 'Lexend', sans-serif; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: all .15s ease; }
.pb-atm-filters button.is-active { background: var(--pb-primary); color: #fff; border-color: var(--pb-primary); }
.pb-atm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.pb-atm-card { border: 1px solid var(--pb-line); border-radius: 16px; overflow: hidden; background: var(--pb-paper); transition: transform .18s ease, box-shadow .18s ease; }
.pb-atm-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(11,47,79,.1); }
.pb-atm-photo { aspect-ratio: 16/10; background: var(--pb-secondary-100); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pb-atm-photo img { width: 100%; height: 100%; object-fit: cover; }
.pb-atm-body { padding: 16px 18px; }
.pb-atm-region { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--pb-secondary-700); }
.pb-atm-body h3 { font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 600; color: var(--pb-ink); margin: 6px 0 4px; }
.pb-atm-num { font-size: 13px; color: var(--pb-muted); margin: 0 0 2px; }
.pb-atm-coords { font-size: 12px; color: var(--pb-muted); margin: 0 0 8px; }
.pb-atm-link { font-size: 13px; font-weight: 600; color: var(--pb-secondary-700); text-decoration: none; }
.pb-atm-link:hover { text-decoration: underline; }
.pb-atm-empty { color: var(--pb-muted); grid-column: 1 / -1; }
@media (max-width: 900px) { .pb-atm-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .pb-atm-grid { grid-template-columns: 1fr; } }

.pb-member-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.pb-member { display: grid; grid-template-columns: 84px 1fr; gap: 20px; background: var(--pb-paper); border: 1px solid var(--pb-line); border-radius: 18px; padding: 24px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.pb-member:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(11, 47, 79, .08); border-color: rgba(11, 47, 79, .15); }
.pb-member-ph { border-style: dashed; opacity: .9; }
.pb-member-photo { width: 84px; height: 84px; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, var(--pb-primary), var(--pb-primary-300)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pb-member-photo img { width: 100%; height: 100%; object-fit: cover; }
.pb-member-initials { font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 28px; color: #fff; letter-spacing: .5px; }
.pb-member-body h3 { font-family: 'Lexend', sans-serif; font-size: 18px; font-weight: 600; color: var(--pb-ink); margin: 0 0 4px; letter-spacing: -.2px; }
.pb-member-role { font-size: 13px; font-weight: 600; color: var(--pb-secondary-700); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
.pb-member-bio { font-size: 13.5px; line-height: 1.55; color: var(--pb-muted); margin: 0; }
@media (max-width: 720px) { .pb-member-grid { grid-template-columns: 1fr; } .pb-member { grid-template-columns: 64px 1fr; gap: 16px; padding: 18px; } .pb-member-photo { width: 64px; height: 64px; } }

.pb-post-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
.pb-post { background: var(--pb-paper); border: 1px solid var(--pb-line); border-radius: 18px; overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; display: flex; flex-direction: column; }
.pb-post:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(11, 47, 79, .08); }
.pb-post-cover { aspect-ratio: 16/9; overflow: hidden; background: var(--pb-secondary-100); }
.pb-post-cover img { width: 100%; height: 100%; object-fit: cover; }
.pb-post-body { padding: 22px; }
.pb-post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; color: var(--pb-muted); }
.pb-post-tag { background: var(--pb-secondary-100); color: var(--pb-secondary-700); font-weight: 600; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
.pb-post-body h3 { font-family: 'Lexend', sans-serif; font-size: 19px; font-weight: 600; color: var(--pb-ink); margin: 0 0 8px; letter-spacing: -.2px; }
.pb-post-summary { font-size: 14px; line-height: 1.55; color: var(--pb-muted); margin: 0 0 12px; }
.pb-post-more summary { font-size: 13px; font-weight: 600; color: var(--pb-secondary-700); cursor: pointer; }
.pb-post-content { margin-top: 12px; }
.pb-post-content p { font-size: 14px; line-height: 1.6; color: var(--pb-ink); margin: 0 0 10px; }
@media (max-width: 720px) { .pb-post-grid { grid-template-columns: 1fr; } }

/* ---- Admin panel ---- */
.adm-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(8, 24, 40, .55); backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; }
.adm-shell { width: 100%; max-width: 760px; background: #fff; border-radius: 20px; box-shadow: 0 30px 80px rgba(8, 24, 40, .35); overflow: hidden; font-family: 'Lexend', sans-serif; }
.adm-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; background: var(--pb-primary); color: #fff; }
.adm-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.adm-tabs { display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--pb-line); }
.adm-tabs button { border: 0; background: none; padding: 12px 16px; font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 600; color: var(--pb-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.adm-tabs button.is-active { color: var(--pb-primary); border-bottom-color: var(--pb-secondary); }
.adm-body { padding: 22px; max-height: 70vh; overflow-y: auto; }
.adm-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.adm-toolbar h3, .adm-editor h3, .adm-login h3 { font-size: 18px; font-weight: 600; color: var(--pb-ink); margin: 0; }
.adm-group { margin-bottom: 22px; }
.adm-group h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--pb-secondary-700); margin: 0 0 10px; }
.adm-item { display: flex; align-items: center; gap: 14px; padding: 12px; border: 1px solid var(--pb-line); border-radius: 12px; margin-bottom: 10px; }
.adm-item-av { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--pb-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.adm-item-av-wide { width: 64px; }
.adm-item-av img { width: 100%; height: 100%; object-fit: cover; }
.adm-item-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.adm-item-main strong { font-size: 14px; color: var(--pb-ink); }
.adm-item-main span { font-size: 12.5px; color: var(--pb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adm-row { display: flex; gap: 8px; align-items: center; }
